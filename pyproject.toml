[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-source-audit"
version = "0.1.0"
description = "Source-traceability gate for Claude-generated technical documents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40.0"]
authors = [{ name = "Michael Oshodi" }]
license = { text = "MIT" }

[project.optional-dependencies]
tests = ["pytest>=8.0"]

[project.scripts]
claude-source-audit = "audit:main"

[tool.setuptools]
py-modules = ["audit"]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
